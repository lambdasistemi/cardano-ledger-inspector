name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: nixos
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build inspector UI
        run: nix --quiet build .#packages.x86_64-linux.tx-inspector-ui -o result-inspector

      - name: Build OpenAPI artifact
        run: nix --quiet build .#packages.x86_64-linux.ledger-functional-openapi -o result-openapi

      - name: Build repository docs
        run: nix develop --quiet -c mkdocs build --strict --site-dir _site

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/inspector
          cp -RL result-inspector/. _site/inspector/
          test "$(find _site/inspector -maxdepth 1 -name 'inspector.*.wasm' | wc -l)" -eq 1
          test "$(find _site/inspector -maxdepth 1 -name 'rdf_shapes_wasm_bg.*.wasm' | wc -l)" -eq 1
          for wasm in _site/inspector/inspector.*.wasm _site/inspector/rdf_shapes_wasm_bg.*.wasm; do
            test -f "$wasm"
            test -f "$wasm.gz"
            test -f "$wasm.br"
          done
          test -f _site/inspector/index.js.gz
          test -f _site/inspector/index.js.br
          mkdir -p _site/openapi
          cp -L result-openapi/* _site/openapi/
          touch _site/.nojekyll
          chmod -R u+w _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
