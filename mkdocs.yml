site_name: Cardano Ledger WASI
site_url: https://lambdasistemi.github.io/cardano-ledger-inspector/
docs_dir: gh-docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - toc.integrate
    - content.code.copy

nav:
  - Overview: index.md
  - Installation: installation.md
  - User Manual:
      - Functional Layer: functional-layer.md
      - API Definition: api.md
      - Swagger UI: swagger.md
  - Architecture: architecture.md
  - Development:
      - Build and Artifacts: build.md
  - Repository: https://github.com/lambdasistemi/cardano-ledger-inspector

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/js/mermaid-init.js

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - footnotes
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
